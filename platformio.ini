; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` / upload only build the robot board firmware unless -e is given
default_envs = teensy41

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
; the radio driver is lib/RadioHead_RFM23BP, never the framework's RadioHead
lib_ignore = RadioHead

; Remote board firmware. Radio to the receiver, or the USB remote [D-159]: with Stacato on its own USB (Stacato's
; MAVLink heartbeat for 1 s, no vehicle enabled over the radio) it talks MAVLink to Stacato itself and the radio stops
; transmitting; back to the radio when the heartbeat stops. In USB mode the screen shows USB instead of the channel and
; both pushbuttons together toggle a simulated radio dropout (DROP). Flash it powered from its cell.
; Build and flash: pio run -e remote -t upload
[env:remote]
platform = teensy
board = teensy41
framework = arduino
build_flags = -DBOARD_REMOTE
lib_ignore = RadioHead
upload_protocol = teensy-cli
extra_scripts = pre:scripts/fw_version.py

; Host unit tests of the remote's decision logic (lib/RemoteLogic), no hardware: pio test -e native
; Run before flashing the remote (docs/remote-display/README.md)
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -DARDUINO=100 -Itools/screens/host -Ilib/Adafruit-GFX
; the drawing code comes from tools/hostlib/HostGfx (Adafruit_GFX with the Arduino stand-ins), never the hardware
; drivers; it lives outside lib/ so the Teensy builds never see it
lib_extra_dirs = tools/hostlib
lib_ignore = Adafruit-GFX, Adafruit_SSD1305, Adafruit_BusIO, RadioHead_RFM23BP, mavlink
