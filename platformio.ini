; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` / upload only build the robot board firmware unless -e is given
default_envs = teensy41

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
; the radio driver is lib/RadioHead_RFM23BP, never the framework's RadioHead
lib_ignore = RadioHead

; Remote board, normal firmware (nothing connects to its USB in use: flash it powered from its cell)
; Build and flash: pio run -e remote -t upload
[env:remote]
platform = teensy
board = teensy41
framework = arduino
build_flags = -DBOARD_REMOTE
lib_ignore = RadioHead
upload_protocol = teensy-cli

; Remote board with bench diagnostics (radio-bench, docs/radio/05-bench-test-plan.md):
; radio temperature once a second and the chip's answer after a failed init, on USB serial.
; Build and flash: pio run -e remote_diag -t upload
[env:remote_diag]
platform = teensy
board = teensy41
framework = arduino
build_flags = -DBOARD_REMOTE -DRADIO_BENCH_DIAG
lib_ignore = RadioHead
upload_protocol = teensy-cli

; Same with the framework's unmodified RadioHead instead of lib/RadioHead_RFM23BP: shows the
; stall the fork fixes (serial 'k' resets the chip during a transmit). Bench only.
[env:remote_diag_stock]
platform = teensy
board = teensy41
framework = arduino
build_flags = -DBOARD_REMOTE -DRADIO_BENCH_DIAG -DRADIO_STOCK_DRIVER
lib_ignore = RadioHead_RFM23BP
upload_protocol = teensy-cli
