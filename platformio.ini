; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` / upload only build the robot board firmware unless -e is given
default_envs = teensy41

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
; the radio driver is lib/RadioHead_RFM23BP, never the framework's RadioHead
lib_ignore = RadioHead

; Remote board, normal firmware (nothing connects to its USB in use: flash it powered from its cell)
; Build and flash: pio run -e remote -t upload
[env:remote]
platform = teensy
board = teensy41
framework = arduino
build_flags = -DBOARD_REMOTE
lib_ignore = RadioHead
upload_protocol = teensy-cli
