; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` / upload only build the robot board firmware unless -e is given
default_envs = teensy41

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
; the radio driver is lib/RadioHead_RFM23BP, never the framework's RadioHead
lib_ignore = RadioHead

; Remote board, normal firmware (nothing connects to its USB in use: flash it powered from its cell)
; Build and flash: pio run -e remote -t upload
[env:remote]
platform = teensy
board = teensy41
framework = arduino
build_flags = -DBOARD_REMOTE
lib_ignore = RadioHead
upload_protocol = teensy-cli
extra_scripts = pre:scripts/fw_version.py

; Bench only, never deployed: the remote plays the receiver and talks MAVLink to Stacato over its own USB (data only,
; the remote runs from its cell). The radio stays in receive and never transmits. Screen shows USB instead of the
; channel; both pushbuttons pressed together toggle a simulated radio dropout (DROP: link bit 10 clears, sticks
; zero). Build and flash: pio run -e remote_direct -t upload
[env:remote_direct]
extends = env:remote
build_flags = -DBOARD_REMOTE -DREMOTE_DIRECT

; Host unit tests of the remote's decision logic (lib/RemoteLogic), no hardware: pio test -e native
; Run before flashing the remote (docs/remote-display/README.md)
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall
