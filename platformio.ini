; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` / upload only build the robot board firmware unless -e is given
default_envs = teensy41

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; Remote board with bench diagnostics (radio-bench, docs/radio/05-bench-test-plan.md):
; radio temperature once a second and the chip's answer after a failed init, on USB serial.
; Build and flash: pio run -e remote_diag -t upload
[env:remote_diag]
platform = teensy
board = teensy41
framework = arduino
build_flags = -DBOARD_REMOTE -DRADIO_BENCH_DIAG
upload_protocol = teensy-cli
